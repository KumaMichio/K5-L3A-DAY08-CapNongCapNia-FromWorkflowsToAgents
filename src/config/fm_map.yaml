# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in
# docs/failure_taxonomy.md. Every mechanism maps to an existing row; FM-09 was added for v2.
ticket_over_db: FM-03          # ticket text (injection, false delay, authority claim) overrides DB facts
stale_policy: FM-06            # superseded or not-yet-effective clause treated as current
clause_sum: FM-04              # clause parts summed instead of taking the applicable maximum
double_deduct: FM-05           # prior refund subtracted by the agent and again by the host
sibling_refund: FM-07          # money written under a sibling claim of the same order
denied_ignored: FM-02          # host returns policy_denied, agent still reports resolved
reply_ledger_mismatch: FM-08   # reply states an amount the ledger does not hold
cross_principal: FM-09         # acting on / disclosing another principal's order
